name: Contribution Observatory
on:
  push:
    branches: [main]
    paths: ['scripts/observatory.py', '.github/workflows/observatory.yml']
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-observatory
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from GitHub contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/observatory.py
      - name: Commit updated visualization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/observatory.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Contribution Observatory'
            git push
          fi
